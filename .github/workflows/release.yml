name: Release

on:
  push:
    tags: ["v*"]
  # Manual start: tags and releases the version from manifest.json.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        id: version
        run: |
          tag="v$(jq -r .version custom_components/parceltracking/manifest.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json says $tag, tag is $GITHUB_REF_NAME"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build zip
        run: cd custom_components/parceltracking && zip -r ../../parceltracking.zip . -x '*__pycache__*'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: parceltracking.zip
          generate_release_notes: true
